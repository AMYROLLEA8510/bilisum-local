name: Export portable artifact
on:
  push:
    branches: [artifact/v5.2.1-file]
    paths:
      - .github/workflows/export-portable.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable ZIP
        run: python scripts/build_release.py
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BiliSum-Portable-v5.2.1
          path: dist/BiliSum-Portable-v5.2.1.zip
          if-no-files-found: error
          compression-level: 0

name: Bootstrap source

on:
  push:
    paths:
      - bootstrap_payload.b64

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack verified source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bootstrap_payload.b64 > /tmp/bilisum-source.tar.xz
          rm -rf /tmp/bilisum-source
          mkdir -p /tmp/bilisum-source
          tar -xJf /tmp/bilisum-source.tar.xz -C /tmp/bilisum-source
          test -f /tmp/bilisum-source/bilisum-local/VERSION
          test "$(tr -d '\r\n' < /tmp/bilisum-source/bilisum-local/VERSION)" = "5.2.0"
          cp -a /tmp/bilisum-source/bilisum-local/. .
          rm -f bootstrap_payload.b64 .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish BiliSum 5.2.0"
          git push origin HEAD:main

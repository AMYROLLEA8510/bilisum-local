name: Apply stability patch
on:
  push:
    branches: [agent/v5.2.1-stability]
    paths: [stability_patch.ready]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested 5.2.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat stability_patch.part* | base64 -d | xz -d > /tmp/bilisum-5.2.1.patch
          git apply --check /tmp/bilisum-5.2.1.patch
          git apply /tmp/bilisum-5.2.1.patch
          rm -f stability_patch.ready stability_patch.part* stability_patch.b64 .github/workflows/apply-stability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize batch processing for 5.2.1"
          git push origin HEAD:agent/v5.2.1-stability

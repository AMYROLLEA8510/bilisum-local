<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BiliSum 设置</title>
  <style>
    :root{color-scheme:light dark}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;max-width:860px;margin:36px auto;padding:0 22px;color:#18191c;background:#fafafa}.card{background:#fff;border:1px solid #e7e7e7;border-radius:12px;padding:20px;margin:14px 0}h1{font-size:24px;margin:0 0 6px}h2{font-size:15px;margin:0 0 14px}.sub,.hint{color:#6f7175;font-size:12px;line-height:1.7}label{display:block;margin:15px 0 6px;font-weight:650;font-size:13px}input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid #d8d9dc;border-radius:8px;box-sizing:border-box;background:#fff;color:#18191c}.row{display:flex;gap:10px}.row>div{flex:1}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}.check input{width:16px;height:16px}button{padding:9px 14px;border:1px solid #d8d9dc;border-radius:8px;background:#fff;color:#18191c;cursor:pointer}button.primary{background:#111;color:#fff;border-color:#111}.status{margin-top:10px;padding:10px 12px;border-radius:8px;background:#f4f5f6;font-size:12px;line-height:1.65;word-break:break-all}.ok{color:#16613b}.bad{color:#9f1e1e}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{display:flex;align-items:center;gap:10px;margin:20px 0 40px}@media(prefers-color-scheme:dark){body{background:#17181a;color:#ececec}.card{background:#202124;border-color:#34363a}input[type=text],input[type=number],select,button{background:#27292d;color:#ececec;border-color:#42454a}.status{background:#292b2f}.hint,.sub{color:#a7aab0}.primary{background:#f1f1f1!important;color:#111!important;border-color:#f1f1f1!important}}
  </style>
</head>
<body>
  <h1>BiliSum</h1>
  <div class="sub">字幕优先；缺字幕时本地听写。整理、缓存与文件保存均在本机完成。</div>

  <div class="card">
    <h2>整理</h2>
    <label>本地模型</label>
    <input id="model" type="text" value="auto">
    <p class="hint">保持 <code>auto</code> 可直接复用本机已有的兼容 Ollama 模型。</p>
    <label>笔记模式</label>
    <select id="summary-mode">
      <option value="auto">自动判断</option>
      <option value="course">课程笔记</option>
      <option value="general">一般内容</option>
    </select>
    <label class="check"><input id="auto" type="checkbox">打开新视频后自动整理</label>
    <label class="check"><input id="auto-open" type="checkbox">完成后自动展开浮窗</label>
    <label class="check"><input id="auto-save-note" type="checkbox">单条完成后自动保存 TXT</label>
    <label class="check"><input id="auto-save-batch" type="checkbox">批次完成后自动保存合并 TXT</label>
    <div class="actions"><button id="local-test">检测本地环境</button></div>
    <div id="local-status" class="status">尚未检测</div>
  </div>

  <div class="card">
    <h2>保存</h2>
    <div class="actions"><button id="choose-dir">选择 / 更改目录</button><button id="clear-dir">清除目录</button></div>
    <label>手动路径（系统选择器不可用时）</label>
    <div class="row"><div><input id="manual-dir" type="text" placeholder="例如 D:\\Notes\\BiliSum 或 /Users/me/Notes"></div><div style="flex:0 0 auto"><button id="set-dir">使用此路径</button></div></div>
    <div id="save-status" class="status">尚未读取</div>
    <p class="hint">默认保存为 UTF-8 BOM TXT；批量任务默认合并为一个文件。</p>
  </div>

  <div class="card">
    <h2>听写</h2>
    <label class="check"><input id="asr-enabled" type="checkbox">无 B 站字幕时自动听写</label>
    <div class="row">
      <div><label>Whisper 模型</label><select id="asr-model"><option value="auto">auto</option><option value="base">base</option><option value="small">small</option><option value="medium">medium</option><option value="large-v3-turbo">large-v3-turbo</option></select></div>
      <div><label>设备</label><select id="asr-device"><option value="auto">auto</option><option value="cpu">CPU</option><option value="cuda">CUDA</option></select></div>
    </div>
    <div class="row">
      <div><label>语言</label><select id="asr-language"><option value="">自动识别</option><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
      <div><label>单分 P 最长（分钟，0 = 不限）</label><input id="asr-max" type="number" min="0" step="10" value="240"></div>
    </div>
  </div>

  <div class="card">
    <h2>批量</h2>
    <label>视频间隔（毫秒）</label>
    <input id="delay" type="number" min="600" step="100" value="1400">
    <p class="hint">若 B 站出现请求频率限制，可提高到 2000–4000。整理与听写分别排队，避免同时占满内存或显存。</p>
    <div class="actions"><button id="bili-test">检查 B 站接口</button></div>
    <div id="bili-status" class="status">尚未检测</div>
  </div>

  <div class="card">
    <h2>更新</h2>
    <label>便携版更新策略</label>
    <select id="update-mode"><option value="off">不检查</option><option value="notify">仅提示（推荐）</option><option value="auto">自动安装</option></select>
    <p class="hint">默认仅提示。更新只替换程序文件，保留本地模型、缓存与设置；源码 Git checkout 不使用内置更新器。</p>
    <div class="actions"><button id="update-check">检查更新</button><button id="update-install">安装可用更新</button></div>
    <div id="update-status" class="status">尚未检查</div>
  </div>

  <div class="footer"><button id="save" class="primary">保存设置</button><span id="saved" class="hint"></span></div>
  <script src="options.js"></script>
</body>
</html>
